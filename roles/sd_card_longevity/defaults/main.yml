---
# defaults file for sd_card_longevity
#
# Cuts writes to an SD-booted SBC (Raspberry Pi / Orange Pi) so the card
# lasts. Safe subset: compressed RAM swap instead of swap-on-card, tmpfs for
# temp dirs, and turning off Raspbian's dphys-swapfile. Does NOT rewrite the
# root fstab line (RPi OS Bookworm already mounts / with noatime).

sd_longevity_zram_enabled: true
sd_longevity_zram_percent: 50          # % of RAM used for compressed swap
sd_longevity_zram_algo: "zstd"
sd_longevity_zram_priority: 100

sd_longevity_disable_dphys_swapfile: true   # Raspbian's swap file on the card

sd_longevity_tmpfs_paths:
  - { path: /tmp, size: "256M" }
  - { path: /var/tmp, size: "64M" }
