---
# Detect if Pi-hole is Docker-based or traditional installation.
# Asks the target host itself: a Pi-hole container named pihole-<host>
# (running or stopped) means Docker-managed. A missing docker binary or an
# empty result means a traditional install.

- name: Look for this host's Pi-hole container
  ansible.builtin.command:
    cmd: "docker ps -a --filter 'name=^pihole-{{ inventory_hostname | lower }}$' --format '{{ '{{' }}.Names{{ '}}' }}'"
  register: pihole_container
  failed_when: false
  changed_when: false
  check_mode: false

- name: Set Pi-hole deployment type
  ansible.builtin.set_fact:
    pihole_is_docker: "{{ pihole_container.rc == 0 and (pihole_container.stdout | trim) != '' }}"
    pihole_container_name: "pihole-{{ inventory_hostname | lower }}"

- name: Display Pi-hole deployment type
  ansible.builtin.debug:
    msg: "Pi-hole deployment type: {{ 'Docker-based' if pihole_is_docker else 'Traditional installation' }}"
