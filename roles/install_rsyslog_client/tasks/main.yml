---
# Ship this host's syslog to the central collector. See dotfiles plan
# 2026-10-20-central-logging-voyager.md.

- name: Install rsyslog
  ansible.builtin.apt:
    name: rsyslog
    state: present

- name: Ensure the queue spool directory exists on persistent disk
  ansible.builtin.file:
    path: /var/spool/rsyslog
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Drop the old append-a-line forwarding rule from rsyslog.conf, if present
  ansible.builtin.lineinfile:
    path: /etc/rsyslog.conf
    regexp: '^\*\.\* @{1,2}[^ ]+:514\s*$'
    state: absent
  notify: restart rsyslog

- name: Deploy config and validate the full rsyslog configuration (roll back on error)
  block:
    - name: Deploy 90-forward.conf.j2
      ansible.builtin.template:
        src: 90-forward.conf.j2
        dest: /etc/rsyslog.d/90-forward.conf
        owner: root
        group: root
        mode: "0644"
      notify: restart rsyslog

    - name: Validate the full rsyslog config
      ansible.builtin.command: rsyslogd -N1
      changed_when: false
      check_mode: false
  rescue:
    - name: Remove the config that failed validation
      ansible.builtin.file:
        path: /etc/rsyslog.d/90-forward.conf
        state: absent

    - name: Stop here so rsyslog is not restarted on a bad config
      ansible.builtin.fail:
        msg: "rsyslog config failed validation; /etc/rsyslog.d/90-forward.conf removed"

- name: Enable and start rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true
