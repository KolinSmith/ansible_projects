---
# Create target directories on remote host
- name: Create docker directory
  file:
    path: "/home/{{ ansible_user }}/docker"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

- name: Create docker_data directory
  file:
    path: "/home/{{ ansible_user }}/docker_data"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'

# Copy docker-compose.yml to ~/docker/
- name: Copy docker-compose.yml for {{ deploy_docker_services_for }}
  copy:
    src: "{{ docker_projects_base_path }}/{{ deploy_docker_services_for }}/docker-compose.yml"
    dest: "/home/{{ ansible_user }}/docker/docker-compose.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'

# Deploy .env from vault-populated template
- name: Deploy .env for {{ deploy_docker_services_for }}
  template:
    src: "{{ deploy_docker_services_for }}.env.example"
    dest: "/home/{{ ansible_user }}/docker/.env"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'

# Remove .env.example from target -- secrets live in .env only
- name: Remove .env.example from target
  file:
    path: "/home/{{ ansible_user }}/docker/.env.example"
    state: absent

# Find service config files on the controller (anything beyond docker-compose.yml
# and .env* that needs to be bind-mounted into the container, e.g. torrc, traefik.yml)
- name: Find service config files on controller
  find:
    paths: "{{ docker_projects_base_path }}/{{ deploy_docker_services_for }}"
    file_type: file
    excludes:
      - "docker-compose.yml"
      - ".env*"
      - "README*"
      - ".gitignore"
  register: config_files
  delegate_to: localhost

# Copy config files into ~/docker_data/<service>/ for use as bind mounts
- name: Create service config directory in docker_data
  file:
    path: "/home/{{ ansible_user }}/docker_data/{{ deploy_docker_services_for }}"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when: config_files.files | length > 0

- name: Copy service config files to docker_data
  copy:
    src: "{{ item.path }}"
    dest: "/home/{{ ansible_user }}/docker_data/{{ deploy_docker_services_for }}/"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  loop: "{{ config_files.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

# SearXNG's settings.yml lives nested at dmz/docker-data/searxng/, which the
# generic find/copy above never reaches (it only looks at the top level of
# each service's folder -- not recursive, deliberately, since other hosts'
# nested dirs hold things like Beszel's live DB/SSH key and Traefik's acme.json
# that must never be auto-synced from a possibly-stale git copy). This is a
# single, explicitly-scoped exception for just this one file, not a general
# recursion change.
- name: Create docker-data/searxng directory (dmz only)
  file:
    path: "/home/{{ ansible_user }}/docker-data/searxng"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0755'
  when: deploy_docker_services_for == 'dmz'

- name: Copy SearXNG settings.yml to docker-data (dmz only)
  copy:
    src: "{{ docker_projects_base_path }}/dmz/docker-data/searxng/settings.yml"
    dest: "/home/{{ ansible_user }}/docker-data/searxng/settings.yml"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when: deploy_docker_services_for == 'dmz'

# Mem0's only published image is arm64-only; Voyager is x86_64, so its
# server component is built locally from a pinned source checkout instead
# of a pulled image (see .claude/plans/2026-10-04-hermes-agent-migration.md in the dotfiles repo).
- name: Clone pinned Mem0 source for local build (voyager only)
  git:
    repo: "https://github.com/mem0ai/mem0.git"
    dest: "/home/{{ ansible_user }}/docker_data/voyager/mem0-src"
    version: "v2.2.1"
    force: true
  when: deploy_docker_services_for == 'voyager'

# Dedicated deploy key (write access, scoped to the dotfiles repo only) so the
# Hermes container can commit/push its own skill-driven edits (e.g. the `up`
# skill writing to .claude/progress-logs). Lands under ~/.hermes, which is
# already bind-mounted read-write into the hermes container at /opt/data.
- name: Install Hermes dotfiles deploy key (voyager only)
  copy:
    content: "{{ docker_hermes_dotfiles_deploy_key }}"
    dest: "/home/{{ ansible_user }}/.hermes/dotfiles_deploy_key"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0600'
  no_log: true
  when: deploy_docker_services_for == 'voyager'

# Service-specific configuration
- name: Create status alias for Dockerized Tor relay monitoring (operator only)
  lineinfile:
    path: "/home/{{ ansible_user }}/.zshrc"
    line: "alias status='docker exec -it -e TERM=$TERM tor-relay nyx'"
    regexp: "^alias status="
    state: present
    create: yes
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: '0644'
  when: deploy_docker_services_for == 'operator'

- name: Inject real Jina API key into deployed SearXNG settings.yml (dmz only)
  # The tracked repo keeps a REDACTED_JINA_API_KEY placeholder (never a real
  # secret in git); the real value only ever existed as a one-off manual sed
  # on the live host until now. Scoped narrowly via before/after so this
  # can never touch any other engine's block in a 2800+ line file.
  ansible.builtin.replace:
    path: "/home/{{ ansible_user }}/docker-data/searxng/settings.yml"
    after: "engine: jina"
    before: "jina_engine: reader"
    regexp: 'api_key: "REDACTED_JINA_API_KEY"'
    replace: 'api_key: "{{ docker_searxng_jina_api_key }}"'
  no_log: true
  when: deploy_docker_services_for == 'dmz'

- name: Inject real Marginalia API key into deployed SearXNG settings.yml (dmz only)
  ansible.builtin.replace:
    path: "/home/{{ ansible_user }}/docker-data/searxng/settings.yml"
    after: "engine: marginalia"
    before: "- name: mastodon users"
    regexp: 'api_key: "REDACTED_MARGINALIA_API_KEY"'
    replace: 'api_key: "{{ docker_searxng_marginalia_api_key }}"'
  no_log: true
  when: deploy_docker_services_for == 'dmz'

- name: Restart searxng to pick up the real API keys (dmz only)
  community.docker.docker_container:
    name: searxng
    state: started
    restart: true
  when: deploy_docker_services_for == 'dmz'

- name: Login to Forgejo container registry as ansible_user
  shell: >
    echo "{{ vault_forgejo_api_token }}" |
    docker login {{ vault_forgejo_internal_url | regex_replace('^https?://', '') }}
    -u {{ vault_username }} --password-stdin
  no_log: true
  when: deploy_docker_services_for == 'forgejo-runner'

- name: Login to the plain-HTTP Forgejo registry (printer -> cups-samba image)
  # Belt-and-suspenders: the cups-samba package is meant to be Public (then this
  # is a no-op that still succeeds). Keeps the box reproducible if it isn't.
  shell: >
    echo "{{ vault_forgejo_api_token }}" |
    docker login {{ docker_forgejo_registry }}
    -u {{ vault_username }} --password-stdin
  register: _printer_registry_login
  changed_when: "'Login Succeeded' in (_printer_registry_login.stdout | default(''))"
  no_log: true
  when: deploy_docker_services_for == 'printer'

- name: Fix docker config.json permissions so docker group can read it (forgejo-runner only)
  file:
    path: "/home/{{ ansible_user }}/.docker/config.json"
    owner: "{{ ansible_user }}"
    group: docker
    mode: '0640'
  when: deploy_docker_services_for == 'forgejo-runner'
