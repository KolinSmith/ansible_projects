---
# Samba print sharing for Windows clients.
# Deliberately minimal: [printers] + [print$] only. No [homes], no file shares.

  - name: Install Samba packages
    apt:
      name: "{{ print_server_samba_packages }}"
      state: present

  - name: Deploy print-only smb.conf
    ansible.builtin.template:
      src: smb_print.conf.j2
      dest: /etc/samba/smb.conf
      owner: root
      group: root
      mode: "0644"
      validate: "testparm -s %s"
    notify:
      - Restart smbd
      - Restart nmbd

  - name: Ensure the Samba print spool directory exists
    ansible.builtin.file:
      path: /var/spool/samba
      state: directory
      owner: root
      group: root
      mode: "1777"

  - name: Ensure smbd and nmbd are running and enabled
    ansible.builtin.service:
      name: "{{ item }}"
      state: started
      enabled: true
    loop:
      - smbd
      - nmbd
