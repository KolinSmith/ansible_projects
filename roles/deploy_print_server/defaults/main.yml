---
# defaults file for deploy_print_server

# --- CUPS / printer queue ---------------------------------------------------
# The Brother HL-L2320D is driven by the open "brlaser" driver.
print_server_packages:
  - cups
  - cups-client
  - printer-driver-brlaser
  - avahi-daemon

print_server_queue_name: "Brother_Printer"
print_server_queue_location: "Living Room"
print_server_queue_info: "Brother HL-L2320D series"

# PPD to attach to the queue. With printer-driver-brlaser installed this
# resolves via `lpinfo -m`. Override if `lpadmin` rejects it on your release.
print_server_queue_ppd: "drv:///brlaser.drv/br2320d.ppd"

# Device URI. Leave empty to auto-detect the first USB device whose URI
# matches `print_server_usb_match` via `lpinfo -v`.
print_server_queue_uri: ""
print_server_usb_match: "Brother"

print_server_set_default: true
print_server_share_printers: true          # cupsctl --share-printers --remote-any

# --- Samba print sharing (for Windows clients) ----------------------------
print_server_samba_enabled: true
print_server_samba_packages:
  - samba
  - samba-common-bin
print_server_samba_workgroup: "WORKGROUP"
print_server_samba_server_string: "%h print server"

# --- AirPrint / Bonjour --------------------------------------------------
# Needs an mDNS reflector on the router if clients live on another VLAN.
print_server_airprint_enabled: true
