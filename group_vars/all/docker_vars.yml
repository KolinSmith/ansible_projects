---
# Docker environment variables (references vault)
docker_duckdns_token: "{{ vault_docker_duckdns_token }}"
docker_cf_api_key: "{{ vault_docker_cf_api_key }}"
docker_capture_api_secret: "{{ vault_docker_capture_api_secret }}"
docker_superuser_password: "{{ vault_docker_superuser_password }}"
docker_duckdns_domain: "{{ vault_docker_duckdns_domain }}"
docker_search_domain: "{{ vault_docker_search_domain }}"
docker_superuser_email: "{{ vault_docker_superuser_email }}"

# Beszel monitoring secrets (unique per hub deployment)
docker_beszel_agent_token: "{{ vault_beszel_agent_token }}"
docker_beszel_agent_key: "{{ vault_beszel_agent_key }}"

# Hermes Agent + Mem0 (Voyager AI interface migration)
docker_hermes_anthropic_api_key: "{{ vault_hermes_anthropic_api_key }}"
docker_hermes_telegram_bot_token: "{{ vault_hermes_telegram_bot_token }}"
docker_mem0_postgres_password: "{{ vault_mem0_postgres_password }}"
docker_mem0_admin_api_key: "{{ vault_mem0_admin_api_key }}"
docker_mem0_jwt_secret: "{{ vault_mem0_jwt_secret }}"
docker_mem0_openai_api_key: "{{ vault_mem0_openai_api_key }}"
# Dedicated deploy key (write access) so Hermes can commit/push its own
# skill-driven edits (e.g. the `up` skill) to dotfiles -- scoped to this one
# repo, not Kolin's personal key. Added 2026-10-06 (Task 11 smoke test fix).
docker_hermes_dotfiles_deploy_key: "{{ vault_hermes_dotfiles_deploy_key }}"

# Tor relay configuration (operator server)
docker_tor_nickname: "{{ vault_docker_tor_nickname }}"
docker_tor_contact_info: "{{ vault_docker_tor_contact_info }}"

# Forgejo Runner configuration (Orange Pi R1 Plus)
docker_forgejo_instance_url: "{{ vault_forgejo_instance_url }}"
docker_forgejo_runner_token: "{{ vault_forgejo_runner_token }}"

# Non-secret configuration
docker_puid: "1000"
docker_pgid: "100"
docker_site_root: "https://healthchecks.{{ docker_duckdns_domain }}"
docker_cf_api_email: "{{ docker_superuser_email }}"

# Docker projects repository (exists on Ansible controller, not target servers)
docker_projects_repo: "https://github.com/kolinsmith/docker_projects.git"
docker_projects_base_path: "/home/{{ username }}/code_base/docker_projects"  # Path on Ansible controller
docker_projects_branch: "master"

# Print server (docker_projects/printer)
docker_cups_admin_user: "print"
docker_cups_admin_password: "{{ vault_cups_admin_password }}"
docker_printer_name: "Brother_Printer"
docker_printer_uri: "usb://Brother/HL-L2320D%20series?serial=U63877J0N376391"
docker_printer_ppd: "drv:///brlaser.drv/brl2320d.ppd"

# Self-hosted Forgejo container registry (Tailscale IP:port, plain HTTP).
# Same value hardcoded in docker_projects/.forgejo/workflows/build-*.yml.
docker_forgejo_registry: "100.86.4.29:3001"
