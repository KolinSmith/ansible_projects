---
# vars for print_server_provision

# Packages provision_server installs on top of the base image.
necessary_packages:
  - vim
  - git
  - htop
  - curl
  - rsync
  - unattended-upgrades

# --- deploy_print_server overrides -------------------------------------
# Leave the URI empty to auto-detect the USB printer. Pin it once known,
# e.g.: usb://Brother/HL-L2320D%20series?serial=U63877J0N376391
print_server_queue_uri: ""
print_server_queue_name: "Brother_HL-L2320D"
print_server_queue_location: "Living Room"
print_server_samba_enabled: true
print_server_samba_workgroup: "WORKGROUP"
print_server_airprint_enabled: true

# NOTE: the old box (192.168.3.8) was also the central rsyslog collector for
# borg / defiant / ds9 / internetPi / i2pd + pfSense. Per the 2026-09-05
# decision that role moves to voyager (run install_rsyslog_server there) — it
# is deliberately NOT in this playbook.
