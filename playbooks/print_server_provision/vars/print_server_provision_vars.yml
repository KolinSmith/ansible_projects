---
# vars for print_server_provision

# Packages provision_server installs on top of the base image.
necessary_packages:
  - vim
  - git
  - htop
  - curl
  - rsync
  - unattended-upgrades

# --- deploy_docker_env -------------------------------------------------
# Deploys docker_projects/printer/ (cups + beszel-agent + beszel-socket-proxy)
# and renders .env from roles/deploy_docker_env/templates/printer.env.example
# using the fleet-shared vault beszel vars.
deploy_docker_services_for: printer

# --- What is NOT on this box (moved during the migration) -------------
# rsyslog central collector  -> voyager (run install_rsyslog_server there)
# WireGuard VPN server (wg0)  -> pfSense native WireGuard
# cron: github_backup + reconnectUnifi -> voyager
