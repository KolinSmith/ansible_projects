---
# Provision the print-server Pi. Target: a fresh Raspberry Pi OS Lite
# (Bookworm) image at 192.168.9.11 (hostname "printserver"), replacing the
# crufty "printer" @ 192.168.3.8.
#
# Docker-based, like operator: CUPS + Avahi and the beszel-agent all run as
# containers from docker_projects/printer/. rsyslog collector, WireGuard,
# and the cron jobs move off to voyager / pfSense (they are NOT here). See
# dotfiles/.claude/plans/2026-09-05-print-server-migration-and-rebuild.md
#
# First boot (fresh image, still on default pi/raspberry creds):
#   add the host to [provision_servers] in ./hosts, then:
#   sudo ansible-playbook playbooks/print_server_provision/print_server_provision.yml
#
# Afterwards it authenticates as {{ username }} via SSH key and lives in
# [printer]. Start the stack: cd ~/docker && docker compose up -d

  - name: Print server - initial hardening + base packages
    hosts: provision_servers
    gather_facts: true
    become: true
    vars_files:
      - vars/print_server_provision_vars.yml
    roles:
      - role: bootstrap_python
      - role: check_if_pi
      - role: provision_server

  - name: Print server - dotfiles, SD hardening, Docker + services
    hosts: printer
    gather_facts: true
    become: true
    vars_files:
      - vars/print_server_provision_vars.yml
    roles:
      - role: check_if_pi
      - role: import_dotfiles
      - role: install_custom_motd
      - role: artis3n.tailscale
      - role: sd_card_longevity        # zram swap + tmpfs temp dirs, less SD wear
      - role: geerlingguy.docker
      - role: deploy_docker_env
        vars:
          deploy_docker_services_for: printer
      # The stack (docker_projects/printer/): cups (CUPS + Avahi, USB printer
      # passthrough, ./cups config volume) + beszel-agent + beszel-socket-proxy.
      # After the first run, register printserver:45876 in the Beszel hub UI
      # on voyager, then `cd ~/docker && docker compose up -d`.
