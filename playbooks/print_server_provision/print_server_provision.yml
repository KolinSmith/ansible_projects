---
# Provision the print-server Pi. Target: a fresh Bookworm image at
# 192.168.9.11 (hostname "printserver"), replacing the crufty "printer" @
# 192.168.3.8. This box is CUPS-only now — rsyslog collector, WireGuard, and
# the cron jobs move to voyager / pfSense. See
# dotfiles/.claude/plans/2026-09-05-print-server-migration-and-rebuild.md
#
# First boot (fresh image, still on default pi/raspberry creds):
#   add the host to [provision_servers] in ./hosts, then:
#   sudo ansible-playbook playbooks/print_server_provision/print_server_provision.yml
#
# Afterwards it authenticates as {{ username }} via SSH key and lives in
# [printer].

  - name: Print server - initial hardening + base packages
    hosts: provision_servers
    gather_facts: true
    become: true
    vars_files:
      - vars/print_server_provision_vars.yml
    roles:
      - role: bootstrap_python
      - role: check_if_pi
      - role: provision_server

  - name: Print server - dotfiles, monitoring agents, services
    hosts: printer
    gather_facts: true
    become: true
    vars_files:
      - vars/print_server_provision_vars.yml
    roles:
      - role: check_if_pi
      - role: import_dotfiles
      - role: install_custom_motd
      - role: artis3n.tailscale
      - role: deploy_beszel_agent      # native (non-Docker) monitoring agent
      - role: deploy_print_server
      # CUPS-only by decision (2026-09-05). The old box's other services move
      # off during the migration:
      #   - rsyslog central collector -> voyager (install_rsyslog_server there)
      #   - WireGuard VPN server (wg0, 6 peers) -> pfSense native WireGuard
      #   - cron: github_backup + reconnectUnifi -> voyager
      # The old box had NO monitoring agent at all; deploy_beszel_agent above
      # closes that gap. Register printserver:45876 in the Beszel hub UI on
      # voyager after the first run.
