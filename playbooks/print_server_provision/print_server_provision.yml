---
# Provision the print-server Pi. Target: a fresh Armbian (Debian 13 / Trixie,
# minimal, arm64) image at 192.168.9.11 (hostname "printserver"), replacing the
# crufty "printer" @ 192.168.3.8.
#
# Docker-based, like operator: CUPS + Avahi + Samba (custom cups-samba image)
# and the beszel-agent all run as containers from docker_projects/printer/.
# rsyslog collector, WireGuard, and the cron jobs move off to voyager / pfSense
# (they are NOT here). See
# dotfiles/.claude/plans/2026-09-05-print-server-migration-and-rebuild.md
#
# First boot: run expect_scripts/armbian_intial_login.expect (it walks the
# armbian-firstlogin, creates a throwaway `pi` user, then calls this playbook).
# Add the host to [provision_servers] (as pi) and [printer] (as {{ username }})
# in ./hosts first.
#
# Afterwards it authenticates as {{ username }} via SSH key and lives in
# [printer]. Start the stack: cd ~/docker && docker compose up -d

  - name: Print server - initial hardening + base packages
    hosts: provision_servers
    gather_facts: true
    become: true
    vars_files:
      - vars/print_server_provision_vars.yml
    roles:
      - role: bootstrap_python
      - role: check_if_pi
      - role: provision_server

  - name: Print server - ramlog, dotfiles, Docker + services
    hosts: printer
    gather_facts: true
    become: true
    vars_files:
      - vars/print_server_provision_vars.yml
      - ../../group_vars/all/docker_vars.yml
    vars:
      motd_force_install: true
    pre_tasks:
      # --- USB printing reliability on the Pi 3B -------------------------------
      # Both fixes were applied by hand during the 2026-09 bring-up; baking them
      # in so a reprovision reproduces a working print path. See
      # dotfiles/.claude/plans/2026-09-05-print-server-migration-and-rebuild.md
      - name: Blacklist the usblp kernel module
        copy:
          dest: /etc/modprobe.d/blacklist-usblp.conf
          content: "# usblp and the CUPS libusb `usb` backend both claim the printer,\n# so the device flaps (usblp0 removed/re-added) and jobs stall.\nblacklist usblp\n"
          owner: root
          group: root
          mode: '0644'

      - name: Unload usblp now if it happens to be loaded
        community.general.modprobe:
          name: usblp
          state: absent
        failed_when: false

      - name: Check for the RPi bootloader cmdline
        stat:
          path: /boot/firmware/cmdline.txt
        register: rpi_cmdline

      - name: Force USB Full Speed on the dwc_otg controller (cmdline.txt)
        # The Pi 3B dwc_otg controller is unreliable for sustained USB bulk
        # transfer at High Speed; Full Speed (12 Mbit) is slower but stable.
        # The RPi bootloader reads /boot/firmware/cmdline.txt (NOT armbianEnv.txt
        # extraargs) even under Armbian. Takes effect on the next reboot, which
        # remove_default_user performs at the end of this play.
        replace:
          path: /boot/firmware/cmdline.txt
          regexp: '^(?!.*dwc_otg\.speed=1)(.+)$'
          replace: '\1 dwc_otg.speed=1'
        when: rpi_cmdline.stat.exists

    roles:
      - role: check_if_pi
      - role: orangepi_disable_ramlog     # Armbian ramlog -> disk (Armbian-only)
      - role: import_dotfiles
      - role: artis3n.tailscale.machine
        vars:
          tailscale_authkey: "{{ tailscale_auth_key }}"
      - role: geerlingguy.pip
      - role: geerlingguy.docker
        vars:
          docker_users: "{{ username }}"          # so `dax` can run docker without sudo
          docker_daemon_options:
            # trust the plain-HTTP Forgejo registry that hosts cups-samba
            insecure-registries: ["{{ docker_forgejo_registry }}"]
      - role: deploy_docker_env
        vars:
          deploy_docker_services_for: printer
      - role: install_custom_motd
      - role: remove_default_user         # deletes the throwaway `pi`; reboots. LAST.
        vars:
          default_user: "pi"
      # The stack (docker_projects/printer/): cups (CUPS + Avahi + Samba, USB
      # printer passthrough, ./cups config volume) + beszel-agent +
      # beszel-socket-proxy. After the first run, register printserver:45876 in
      # the Beszel hub UI on voyager, then `cd ~/docker && docker compose up -d`.
