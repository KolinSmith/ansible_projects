---
# Apply the custom MOTD over Armbian's on Armbian hosts (operator, ds9, defiant).
# These hosts are not all in the static inventory, so target them by address:
#   ansible-playbook -i 172.16.9.10,192.168.9.4,192.168.9.3, playbooks/install_motd_armbian/install_motd_armbian.yml
# Add --check --diff for a dry run.
- name: Install custom MOTD on Armbian hosts
  hosts: all
  gather_facts: true
  become: true
  vars:
    ansible_user: dax
    ansible_ssh_private_key_file: "/home/dax/.ssh/id_ed25519"
  roles:
    - role: install_custom_motd
      vars:
        motd_force_install: true
        # Banner text per real hostname; hosts not listed show their own hostname.
        motd_header_text: "{{ {'DS9': 'ds9', 'operator': 'operaTor'}[ansible_facts['hostname']] | default('') }}"
